<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAHO 拾图</title><link rel="stylesheet" href="popup.css"></head><body>
<header><span class="logo">M</span><div><h1>MAHO 拾图</h1><p>给下一张画，留一点灵感。</p></div><span class="version">3.1</span></header>
<p id="pageTitle" class="source">正在读取页面…</p>
<button id="scan" class="primary">提取当前页 <span>尺寸筛选 · 预览 · 批量保存</span></button>
<div class="duo"><button id="quick">随手收集<span>悬停 / Alt + 点击 / 拖入</span></button><button id="inbox">打开收集篮<span id="inboxCount">已收集 0 张</span></button></div>
<div class="links"><button id="multi">选择多个页面</button><button id="history">整理历史</button><button id="clearInbox">清空收集篮</button></div>
<section id="multiPanel" hidden><p>勾选本窗口的素材页，最多 12 个。</p><div id="tabs"></div><button id="scanTabs" class="primary">提取选中页面</button><small>只在你点击提取时，请求所选网站的访问权限。</small></section>
<p id="status" role="status" aria-live="polite"></p>
<footer><span>本机收集 · 无账号 · 无订阅</span><a href="使用说明.html" target="_blank">使用说明 ↗</a></footer><script type="module" src="popup.js"></script></body></html>
